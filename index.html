<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 anos do GEN · 55º Encontros Nietzsche</title>
<meta name="description" content="55º Encontros Nietzsche — Nietzsche e seus duplos: destruição e criação. Edição comemorativa dos 30 anos do GEN, em São Paulo, Rio de Janeiro, Brasília, Recife e Toledo.">
<link rel="icon" href="assets/brand/gen-selo-t.png">
<style>
  :root{
    --bg:#FAF5EC; --panel:#FFFCF6; --panel-2:#F5EDDF;
    --ink:#241B12; --muted:#7B6959;
    --line:#E3D5C1; --line-soft:#EFE5D6;
    --accent:#C2571C; --accent-ink:#9B4212; --accent-wash:#C2571C14;
    --sepia:#8A6A3B; --shadow:0 1px 2px #241b1210, 0 8px 24px #241b120d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14100C; --panel:#1D1711; --panel-2:#241D15;
      --ink:#F2E7D7; --muted:#A5937E;
      --line:#352A20; --line-soft:#2A2119;
      --accent:#E68B4C; --accent-ink:#F2A469; --accent-wash:#E68B4C14;
      --sepia:#C9A56A; --shadow:0 1px 2px #0006, 0 8px 24px #0004;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14100C; --panel:#1D1711; --panel-2:#241D15;
    --ink:#F2E7D7; --muted:#A5937E;
    --line:#352A20; --line-soft:#2A2119;
    --accent:#E68B4C; --accent-ink:#F2A469; --accent-wash:#E68B4C14;
    --sepia:#C9A56A; --shadow:0 1px 2px #0006, 0 8px 24px #0004;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:16.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} html{scroll-behavior:auto} }
  img{max-width:100%}
  a{color:var(--accent-ink); text-underline-offset:3px; text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  a:hover{text-decoration-color:var(--accent)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:3px}

  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .serif{font-family:"Hoefler Text","Baskerville","Libre Baskerville",Georgia,"Times New Roman",serif}
  .label{text-transform:uppercase; letter-spacing:.16em; font-size:.68rem; font-weight:700}
  .muted{color:var(--muted)}

  /* ── header ─────────────────────────────── */
  header.site{position:sticky; top:0; z-index:60; background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:saturate(160%) blur(10px); border-bottom:1px solid var(--line)}
  .hbar{display:flex; align-items:center; gap:14px; padding:10px 0}
  .hbrand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); flex:none}
  .hbrand img{width:34px; height:34px; border-radius:50%; background:#F7F1E6; padding:2px; border:1px solid var(--line)}
  .hbrand b{font-size:.92rem; letter-spacing:.02em; line-height:1.1; display:block}
  .hbrand span{font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .hspace{flex:1}
  .themebtn{font:inherit; cursor:pointer; background:transparent; border:1px solid var(--line); color:var(--muted);
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:.9rem; flex:none}
  .themebtn:hover{color:var(--ink); border-color:var(--muted)}
  .menubtn{display:none}
  nav.main{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-top:1px solid var(--line-soft)}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{flex:none; padding:11px 12px 9px; color:var(--muted); text-decoration:none;
    border-bottom:2px solid transparent; text-transform:uppercase; letter-spacing:.12em; font-size:.69rem; font-weight:700}
  nav.main a:hover{color:var(--ink)}
  nav.main a.on{color:var(--accent-ink); border-bottom-color:var(--accent)}

  /* ── hero ───────────────────────────────── */
  .hero{background:linear-gradient(118deg,#7A3410 0%,#C2571C 46%,#E3853F 100%); color:#FFF6EA; position:relative; overflow:hidden}
  .hero::after{content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(126deg,#ffffff0a 0 2px,transparent 2px 46px); pointer-events:none}
  .hero .wrap{position:relative; z-index:1; padding-top:38px; padding-bottom:34px}
  .hero .mark{max-width:320px; width:62%; min-width:230px; display:block; margin:0 0 20px; filter:drop-shadow(0 3px 10px #00000030)}
  .hero h1{font-weight:500; font-size:clamp(2rem,5.6vw,3.6rem); line-height:1.06; margin:0 0 10px; letter-spacing:.005em; text-wrap:balance}
  .hero h1 em{font-style:italic}
  .hero .kick{letter-spacing:.2em; color:#FFE2C4; margin-bottom:6px}
  .hero .sub{color:#FFEBD8; max-width:56ch; margin:14px 0 0; font-size:1.02rem}
  .hero .strip{display:flex; flex-wrap:wrap; gap:10px 28px; align-items:baseline; margin-top:24px; padding-top:18px; border-top:1px solid #ffffff38}
  .hero .strip b{font-size:1.06rem}
  .hero .strip .s{color:#FFE2C4; font-size:.86rem}

  /* ── generic blocks ─────────────────────── */
  main{padding:40px 0 70px; min-height:50vh}
  .phead{margin:0 0 30px}
  .phead .kick{color:var(--sepia); margin-bottom:8px}
  .phead h2{font-weight:500; font-size:clamp(1.7rem,3.8vw,2.6rem); margin:0 0 8px; line-height:1.12; text-wrap:balance}
  .phead .lede{color:var(--muted); max-width:66ch; margin:0}
  .rule{height:4px; border-top:2px solid var(--accent); border-bottom:1px solid var(--line); margin:18px 0 0}
  .prose{max-width:68ch}
  .prose p{margin:0 0 1.1em}
  .prose h3{font-weight:600; font-size:1.2rem; margin:2em 0 .5em}
  .prose ul{padding-left:1.15em; margin:0 0 1.1em}
  .prose li{margin:0 0 .45em}
  h3.sec{font-weight:600; font-size:clamp(1.25rem,2.6vw,1.6rem); margin:0 0 6px}
  .secrule{height:1px; background:var(--line); margin:10px 0 22px}

  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border:1.5px solid var(--accent);
    color:var(--accent-ink); text-decoration:none; text-transform:uppercase; letter-spacing:.11em;
    font-size:.68rem; font-weight:700; border-radius:2px; background:transparent; cursor:pointer; font-family:inherit}
  .btn:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.solid{background:var(--accent); color:#fff}
  .btn.solid:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
  .btn.ghost{border-color:var(--line); color:var(--muted)}
  .btn.ghost:hover{border-color:var(--muted); background:transparent; color:var(--ink)}
  .btnrow{display:flex; flex-wrap:wrap; gap:10px; margin:1.3em 0}
  .note{border-left:3px solid var(--accent); background:var(--accent-wash); padding:12px 16px; margin:1.3em 0; max-width:66ch; border-radius:0 3px 3px 0}

  /* ── home ───────────────────────────────── */
  .routebox{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; padding:18px; box-shadow:var(--shadow); margin:0 0 34px}
  .routebox img{display:block; margin:0 auto; background:#fff; border-radius:3px}
  .routebox figcaption{color:var(--muted); font-size:.82rem; text-align:center; margin-top:10px}
  .citygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px}
  .ccard{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden;
    text-decoration:none; color:var(--ink); display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:transform .16s ease, border-color .16s ease}
  .ccard:hover{transform:translateY(-3px); border-color:var(--accent)}
  .ccard img{display:block; width:100%; aspect-ratio:1024/1536; object-fit:cover}
  .ccard .cb{padding:12px 14px 14px; border-top:1px solid var(--line-soft)}
  .ccard .cn{font-weight:700; font-size:1.02rem; line-height:1.2}
  .ccard .cd{color:var(--accent-ink); font-size:.8rem; font-weight:700; letter-spacing:.06em; margin-top:3px}
  .ccard .cv{color:var(--muted); font-size:.78rem; margin-top:6px; line-height:1.4}

  /* ── programação ────────────────────────── */
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 26px}
  .tab{padding:8px 14px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--muted);
    font-size:.78rem; font-weight:700; letter-spacing:.04em; background:var(--panel)}
  .tab:hover{color:var(--ink); border-color:var(--muted)}
  .tab.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .cityhead{display:grid; grid-template-columns:230px 1fr; gap:26px; align-items:start; margin:0 0 34px}
  @media (max-width:720px){ .cityhead{grid-template-columns:1fr} }
  .cityhead .poster{border:1px solid var(--line); border-radius:4px; overflow:hidden; box-shadow:var(--shadow); cursor:zoom-in; background:var(--panel)}
  .cityhead .poster img{display:block; width:100%}
  .facts{list-style:none; padding:0; margin:14px 0 0}
  .facts li{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:.92rem}
  .facts li .k{flex:none; width:92px; color:var(--sepia); text-transform:uppercase; letter-spacing:.12em; font-size:.66rem; font-weight:700; padding-top:3px}

  .day{margin:0 0 46px}
  .dayhead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:0 0 4px}
  .dayhead h4{font-weight:600; font-size:clamp(1.2rem,2.6vw,1.6rem); margin:0}
  .dayhead .st{color:var(--accent-ink); font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
  .dayrule{height:3px; border-top:2px solid var(--ink); border-bottom:1px solid var(--line); margin:0 0 4px}
  .sect{border-bottom:1px solid var(--line-soft); padding:16px 0}
  .sect:last-child{border-bottom:0}
  .sgrid{display:grid; grid-template-columns:96px 1fr; gap:18px}
  @media (max-width:600px){ .sgrid{grid-template-columns:1fr; gap:4px} }
  .stime{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.06em; padding-top:4px}
  .stitle{font-weight:700; font-size:1.02rem; margin:0 0 2px}
  .smeta{color:var(--muted); font-size:.84rem; margin:0 0 8px}
  .items{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:10px}
  .item{background:var(--panel); border:1px solid var(--line-soft); border-left:3px solid var(--accent);
    border-radius:0 3px 3px 0; padding:10px 14px}
  .item .t{font-variant-numeric:tabular-nums; color:var(--accent-ink); font-size:.72rem; font-weight:700; letter-spacing:.08em; display:block; margin-bottom:2px}
  .item .w{font-weight:700}
  .item .a{color:var(--muted); font-weight:400; font-size:.9em}
  .item .ti{margin-top:2px; font-size:.96rem}
  .item .ti i{font-style:italic}
  .sect.plain .item{border-left-color:var(--sepia)}
  .item.bare{background:transparent; border:0; border-left:3px solid var(--line); padding:4px 0 4px 14px}
  .item.bare .w{font-weight:600; color:var(--muted); font-size:.92rem}
  .sect.break{color:var(--muted); font-style:italic}
  .names{margin:6px 0 0; font-size:.96rem}
  .names b{font-weight:700}

  .postergrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin:16px 0 34px}
  .pcard{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden; box-shadow:var(--shadow)}
  .pcard img{display:block; width:100%; cursor:zoom-in}
  .pcard .pb{padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line-soft)}
  .pcard .pl{font-size:.8rem; font-weight:700}
  .pcard a.dl{font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; text-decoration:none; color:var(--muted); white-space:nowrap}
  .pcard a.dl:hover{color:var(--accent-ink)}

  /* ── livros ─────────────────────────────── */
  .book{display:grid; grid-template-columns:168px 1fr; gap:26px; padding:26px 0; border-bottom:1px solid var(--line-soft); align-items:start}
  @media (max-width:640px){ .book{grid-template-columns:1fr; gap:16px} .book .cover{max-width:180px} }
  .book .cover{border:1px solid var(--line); border-radius:3px; overflow:hidden; box-shadow:var(--shadow); cursor:zoom-in; background:var(--panel)}
  .book .cover img{display:block; width:100%}
  .book h4{font-weight:600; font-size:1.22rem; margin:0 0 4px; line-height:1.25}
  .book .by{font-weight:700; font-size:.94rem}
  .book .pub{color:var(--sepia); font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin:6px 0 12px}
  .book p{margin:0 0 .9em; font-size:.97rem}
  .book blockquote{margin:1em 0 0; padding:10px 0 10px 16px; border-left:3px solid var(--sepia); color:var(--muted); font-style:italic; font-size:.95rem}
  .book blockquote cite{display:block; font-style:normal; font-weight:700; font-size:.82rem; color:var(--ink); margin-top:8px}
  .simple{list-style:none; padding:0; margin:.6em 0 0}
  .simple li{padding:11px 0; border-bottom:1px solid var(--line-soft)}
  .simple li i{font-style:italic}
  .simple li span{display:block; color:var(--muted); font-size:.85rem; margin-top:2px}

  /* ── núcleos / chips ────────────────────── */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:.8em 0 0}
  .chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; font-size:.8rem; font-weight:700; letter-spacing:.03em}
  .cols2{display:grid; grid-template-columns:1fr 1fr; gap:26px}
  @media (max-width:720px){ .cols2{grid-template-columns:1fr} }
  .card{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow)}
  .card .label{color:var(--sepia); margin-bottom:8px}
  .card p{margin:.25em 0}
  .qr{background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px; width:max-content}
  .qr img{display:block; width:170px; height:170px}

  /* ── lightbox ───────────────────────────── */
  #lb{position:fixed; inset:0; z-index:200; background:#120c08f2; display:none; align-items:center; justify-content:center; padding:24px}
  #lb.on{display:flex}
  #lb img{max-width:100%; max-height:calc(100vh - 110px); border-radius:3px; box-shadow:0 20px 60px #0008}
  #lb .cl{position:absolute; top:14px; right:18px; background:transparent; border:1px solid #ffffff55; color:#fff;
    width:40px; height:40px; border-radius:50%; font-size:1.2rem; cursor:pointer; font-family:inherit}
  #lb .cl:hover{background:#ffffff1a}
  #lb .cap{position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#F5E4D2; font-size:.82rem}

  /* ── footer ─────────────────────────────── */
  footer.site{border-top:1px solid var(--line); background:var(--panel-2); padding:34px 0 40px; color:var(--muted); font-size:.9rem}
  footer.site .fg{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:28px}
  @media (max-width:720px){ footer.site .fg{grid-template-columns:1fr} }
  footer.site .label{color:var(--sepia); display:block; margin-bottom:10px}
  footer.site ul{list-style:none; margin:0; padding:0}
  footer.site li{margin:0 0 7px}
  footer.site a{text-decoration:none}
  footer.site a:hover{text-decoration:underline}
  footer.site .sig{background:#F7F1E6; border:1px solid var(--line); border-radius:3px; padding:10px 14px; width:max-content; margin-bottom:14px}
  footer.site .sig img{display:block; width:190px}
  .cred{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:.78rem}

  @media print{
    header.site,footer.site,#lb,.btnrow,.tabs,.themebtn{display:none!important}
    body{background:#fff;color:#000;font-size:11pt}
    .item{break-inside:avoid; border-left-color:#999}
    .day{break-inside:auto}
    a{color:#000;text-decoration:none}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="hbar">
      <a class="hbrand" href="#/">
        <img src="assets/brand/gen-selo-t.png" alt="">
        <span style="display:block"><b>30 anos do GEN</b><span>55º Encontros Nietzsche</span></span>
      </a>
      <div class="hspace"></div>
      <button class="themebtn" id="theme" type="button" title="Alternar tema" aria-label="Alternar tema">◐</button>
    </div>
    <nav class="main" id="nav" aria-label="Principal"></nav>
  </div>
</header>

<div id="hero"></div>
<main><div class="wrap" id="app"></div></main>
<footer class="site"><div class="wrap" id="foot"></div></footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <button class="cl" type="button" id="lbclose" aria-label="Fechar">✕</button>
  <img id="lbimg" src="" alt="">
  <div class="cap" id="lbcap"></div>
</div>

<script>
/* ═══════════════════════ dados do evento ═══════════════════════ */

const EVENTO = {
  edicao: "55º Encontros Nietzsche",
  tema: "Nietzsche e seus duplos: destruição e criação",
  marco: "30 anos do GEN — Grupo de Estudos Nietzsche",
  periodo: "21 de setembro a 2 de outubro de 2026",
  sitePrincipal: "https://gen-grupodeestudosnietzsche.net/",
  anteriores: "https://gen-grupodeestudosnietzsche.net/encontros-nietzsche/",
  cadernos: "https://gen-grupodeestudosnietzsche.net/cadernos-nietzsche/",
  uspEvento: "https://filosofia.fflch.usp.br/eventos/12422"
};

const SOBRE = {
  gen: [
    "O GEN – Grupo de Estudos Nietzsche é um grupo de pesquisa internacional, que reúne estudiosos brasileiros e europeus da filosofia nietzschiana. Fundado por Scarlett Marton em 1996, o GEN esteve, de início, ligado ao Departamento de Filosofia da Universidade de São Paulo. Hoje presente em todo o Brasil, do Ceará ao Rio Grande do Sul, continua a perseguir o propósito de fazer avançar as investigações acerca do pensamento nietzschiano e julga que, para tanto, é essencial promover a discussão acerca das mais variadas interpretações dos textos do filósofo.",
    "Empreendimento pioneiro na América do Sul, o GEN procura não apenas incentivar os estudos nietzschianos entre nós como dialogar com as diversas Nietzsche Societies e Centros de pesquisa internacionais. Atuando em três frentes distintas, o GEN organiza suas atividades em torno dos <i>Cadernos Nietzsche</i>, da Coleção <i>Sendas &amp; Veredas</i> e dos <i>Encontros Nietzsche</i>."
  ],
  nucleos: ["GEN/USP","GEN Unirio","GEN UnB","GEN/RECIFE","GEN/UFPE","GEN/UNIFESP","GEN/UFABC","GEN/UFSB","GEN/UNIOESTE","GEN/UFPel","GEN/UFRB/UFBA"],
  encontros: [
    "Os Encontros Nietzsche consistem num fórum permanente de debates acerca da filosofia nietzschiana. Promovidos pelo GEN, recebem seus parceiros intelectuais, tanto da cena acadêmica nacional como internacional. Ocorrendo sempre nos meses de maio e setembro, é também a ocasião em que o GEN apresenta suas publicações, lançando os novos números dos <i>Cadernos Nietzsche</i> e os novos títulos da coleção <i>Sendas &amp; Veredas</i>. Tendo lugar nos mais diversos estados do território nacional, procuram concorrer desde 1996 para a difusão da pesquisa sobre o pensamento de Nietzsche no Brasil.",
    "Em 2026, a realização da 55ª edição dos Encontros Nietzsche, intitulada <i>Nietzsche e seus duplos: destruição e criação</i>, marca os trinta anos do GEN, celebrando sua trajetória e sua importância para a consolidação dos estudos nietzschianos no país. Nesta edição comemorativa, o evento será realizado nas cidades de São Paulo, Rio de Janeiro, Brasília, Recife e Toledo."
  ]
};

/* ── São Paulo ─────────────────────────────────────────────── */
const SP = {
  slug:"sao-paulo", nome:"São Paulo", uf:"SP",
  datas:"21, 22 e 23 de setembro", datasCurto:"21–23/09",
  local:"Sala 14 — FFLCH/USP",
  endereco:"Av. Prof. Luciano Gualberto, 315 — Cidade Universitária, São Paulo",
  inicio:"Conferências às 14h · Comunicações às 9h",
  realizacao:"USP · UNIFESP · FFLCH · PPG-FIL",
  cartaz:"cartaz-sao-paulo",
  links:[["Página do evento na FFLCH/USP", EVENTO.uspEvento]],
  qr:{img:"assets/brand/qr-ouvintes-sp.png", t:"Inscrições para ouvintes — São Paulo"},
  cartazes:[
    ["prog-sp-21-09","Programação · 21/09"],
    ["prog-sp-22-09","Programação · 22/09"],
    ["prog-sp-comunicacoes","Comunicações · 21, 22 e 23/09"]
  ],
  dias:[
    { id:"sp-21", titulo:"21 de setembro", st:"Início às 14h", sects:[
      { t:"14h", h:"Abertura", names:"<b>Eduardo Brandão</b> (USP) · <b>Vânia Dutra de Azeredo</b> (GEN/UNIRIO) · <b>Eder Corbanezi</b> (GEN/UNESP)" },
      { t:"14h15", h:"Conferências", items:[
        {w:"Vânia Dutra de Azeredo", a:"GEN/UNIRIO", ti:"A leitura como canto paralelo."},
        {w:"André Luís Mota Itaparica", a:"GEN/UFRB", ti:"Nietzsche ou MacIntyre?"},

function sect(s){
  const cls = "sect" + (s.plain?" plain":"") + (s.brk?" break":"");
  let body = `<div class="stitle">${s.h}</div>`;
  if(s.m) body += `<p class="smeta">${s.m}</p>`;
  if(s.names) body += `<p class="names">${s.names}</p>`;
  if(s.items) body += `<ul class="items">${s.items.map(i=>`
    <li class="item${(!i.ti && !i.a)?" bare":""}">
      ${i.t?`<span class="t">${i.t}</span>`:""}
      <span class="w">${i.w}</span>${i.a?` <span class="a">(${i.a})</span>`:""}
      ${i.ti?`<div class="ti">${i.ti}</div>`:""}
    </li>`).join("")}</ul>`;
  return `<div class="${cls}"><div class="sgrid"><div class="stime">${s.t||""}</div><div>${body}</div></div></div>`;
}

function resolve(){
  const h = (location.hash.replace(/^#/,"") || "/").replace(/\/$/,"") || "/";
  const m = h.match(/^\/programacao\/([a-z-]+)$/);
  if(m){
    const c = CIDADES.find(x=>x.slug===m[1]);
    if(c) return {rota:"/programacao", cidade:c};
    return {rota:"/programacao"};
  }
  return { rota: ROTAS.some(([r])=>r===h) ? h : "/" };
}

  document.getElementById("nav").innerHTML = ROTAS.map(([r,n])=>
    `<a href="#${r}" class="${r===rota?'on':''}">${n}</a>`).join("");
  document.getElementById("hero").innerHTML = renderHero(rota);
  document.getElementById("app").innerHTML = cidade ? renderCidade(cidade) : PAGINAS[rota]();
  document.getElementById("foot").innerHTML = renderFoot();
  document.querySelectorAll('a[href]').forEach(a=>{
    const h=a.getAttribute("href")||"";
    if(/^https?:/.test(h)){ a.target="_blank"; a.rel="noopener"; }
  });
  const t = cidade ? `${cidade.nome} · ` : (rota==="/" ? "" : `${(ROTAS.find(([r])=>r===rota)||[,""])[1]} · `);
  document.title = `${t}30 anos do GEN · 55º Encontros Nietzsche`;
}

/* ── lightbox ─────────────────────────────── */
const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg"), lbcap=document.getElementById("lbcap");
function closeLb(){ lb.classList.remove("on"); lbimg.src=""; document.body.style.overflow=""; }
document.getElementById("lbclose").addEventListener("click", closeLb);
lb.addEventListener("click", e=>{ if(e.target===lb) closeLb(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && lb.classList.contains("on")) closeLb(); });
document.addEventListener("click", e=>{
  const z=e.target.closest("[data-zoom]");
  if(!z) return;
  lbimg.src=z.dataset.zoom; lbimg.alt=z.alt||"";
  lbcap.textContent=z.dataset.cap||"";
  lb.classList.add("on"); document.body.style.overflow="hidden";
});

/* ── tema ─────────────────────────────────── */
const savedTheme = localStorage.getItem("gen-theme");
if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
document.getElementById("theme").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("gen-theme", next);
});

window.addEventListener("hashchange", ()=>{ render(); window.scrollTo({top:0}); });
render();
</script>
